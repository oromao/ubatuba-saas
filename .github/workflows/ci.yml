name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: TypeScript check (API)
        run: npx -w apps/api tsc --noEmit
      - name: Lint (API)
        run: npm run lint -w apps/api

  lint-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: TypeScript check (Web)
        run: npx -w apps/web tsc --noEmit
      - name: Lint (Web)
        run: npm run lint -w apps/web

  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: rootpass
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build (API)
        run: npm run build -w apps/api
      - name: Test (API)
        run: npm test -w apps/api
        env:
          MONGO_URL: mongodb://root:rootpass@localhost:27017/flydea?authSource=admin
          JWT_SECRET: test-secret

  deploy:
    needs: [lint-api, lint-web, test-api]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /root/ubatuba-saas
            git pull origin main
            docker compose -f docker-compose.yml --profile prod down --remove-orphans || true
            docker compose -f docker-compose.yml --profile prod up -d --build
            echo "Waiting for API health..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:4000/health > /dev/null 2>&1; then
                echo "API is healthy"
                break
              fi
              echo "Attempt $i: waiting..."
              sleep 5
            done
            docker image prune -f
